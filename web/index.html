<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sea-Article 简易前端</title>
<link href="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.snow.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --border: #e5e7eb;
    --text: #1f2937; --muted: #6b7280; --primary: #2563eb;
    --danger: #dc2626; --ok: #059669;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--text); font-size: 15px; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  header h1 { font-size: 20px; margin: 0; }
  button { cursor: pointer; border: 1px solid var(--border); background: #fff;
           padding: 7px 14px; border-radius: 6px; font-size: 14px; }
  button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  button.danger { background: #fff; color: var(--danger); border-color: var(--danger); }
  button:hover { opacity: .88; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
          padding: 18px; margin-bottom: 14px; }
  input, textarea, select { width: 100%; padding: 9px 10px; border: 1px solid var(--border);
          border-radius: 6px; font-size: 14px; font-family: inherit; margin-top: 6px; }
  textarea { min-height: 220px; resize: vertical; }
  label { font-size: 13px; color: var(--muted); }
  .row { margin-bottom: 12px; }
  .hidden { display: none !important; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tabs button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .msg { padding: 10px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 14px; }
  .msg.err { background: #fef2f2; color: var(--danger); }
  .msg.ok { background: #ecfdf5; color: var(--ok); }
  .art { border-bottom: 1px solid var(--border); padding: 14px 0; cursor: pointer; }
  .art:last-child { border-bottom: none; }
  .art h3 { margin: 0 0 6px; font-size: 16px; }
  .art .meta { font-size: 12.5px; color: var(--muted); }
  .art .brief { margin: 6px 0 0; color: #374151; font-size: 14px; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; }
  pre { background: #0f172a; color: #e2e8f0; padding: 14px; border-radius: 8px;
        white-space: pre-wrap; word-break: break-word; font-size: 13.5px; }
  .q-editor { min-height: 320px; }
  .ql-container { font-size: 15px; }
  .article-body img { max-width: 100%; border-radius: 8px; }
  .article-body blockquote { border-left: 3px solid var(--border); margin: 10px 0; padding: 4px 14px; color: var(--muted); background: #f9fafb; }
  .article-body pre { background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 8px; overflow-x: auto; }
  .article-body code { background: #f1f5f9; padding: 2px 5px; border-radius: 4px; font-size: 13px; }
  .article-body pre code { background: transparent; padding: 0; }
  .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 10px;
           background: #eff6ff; color: var(--primary); margin-right: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Sea-Article</h1>
    <div id="userBox"></div>
  </header>
  <div id="msgBox"></div>

  <!-- 登录 -->
  <div id="loginView" class="card" style="max-width:380px;margin:40px auto;">
    <h2 style="margin-top:0;font-size:18px;">登录 / 注册</h2>
    <div class="row"><label>用户名</label><input id="loginUser"></div>
    <div class="row"><label>密码</label><input id="loginPass" type="password"></div>
    <div style="display:flex;gap:8px;">
      <button class="primary" onclick="doLogin()">登录</button>
      <button onclick="doRegister()">注册</button>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="mainView" class="hidden">
    <div class="tabs">
      <button id="tabList" class="active" onclick="showTab('list')">文章列表</button>
      <button id="tabNew" onclick="showTab('new')">写文章</button>
    </div>

    <div id="listPane">
      <div class="toolbar">
        <div>共 <b id="totalNum">0</b> 篇</div>
        <div style="display:flex;gap:8px;align-items:center;">
          <button onclick="loadList(page-1)">上一页</button>
          <span id="pageNum">1</span>
          <button onclick="loadList(page+1)">下一页</button>
        </div>
      </div>
      <div class="card" id="listBox"><div class="meta">加载中…</div></div>
    </div>

    <div id="newPane" class="hidden">
      <div class="card">
        <h2 style="margin-top:0;font-size:18px;">发布文章</h2>
        <div class="row"><label>标题 *</label><input id="fTitle"></div>
        <div class="row"><label>摘要</label><input id="fBrief"></div>
        <div class="row"><label>分类标签 manual_type_tag</label><input id="fTag" placeholder="如：tech"></div>
        <div class="row"><label>二级标签（逗号分隔）</label><input id="fTags" placeholder="如：go,微服务"></div>
        <div class="row"><label>正文 *</label><div id="editor" class="q-editor"></div></div>
        <button class="primary" onclick="doPublish()">发布</button>
      </div>
    </div>

    <div id="detailPane" class="hidden">
      <button onclick="showTab('list')">← 返回列表</button>
      <div class="card" id="detailBox"></div>
    </div>
  </div>
</div>

<script>
// ====== 接口地址：全部走本地 dev-server 同源代理，无需改 ======
var ARTICLE_API = '/v1';
var USER_API     = '/usercenter/v1';
var MINIO_BASE   = '/minio/articles'; // 经代理访问 MinIO bucket
// ============================================================

var token = localStorage.getItem('sa_token') || '';
var page = 1;
var quill = null;
function ensureEditor(){
  if(quill || typeof Quill === 'undefined') return;
  quill = new Quill('#editor', {
    theme: 'snow',
    placeholder: '输入正文，支持加粗、标题、列表、引用、代码块、图片…'
  });
  bindImageUpload(quill);
}

// 图片直传：先申请预签名 PUT 地址，再直接上传到 MinIO。
// 这样图片不经过 article-api / gRPC 中转，绕开内存放大与 gRPC 默认 4MB 上限。
async function uploadImageFile(file){
  var name = file.name || ('pasted-' + Date.now() + '.png');
  var type = file.type || 'image/png';
  // 1) 申请预签名地址（后端按 content_type 归入 images/ 前缀）
  var up = await api('/article/upload/url?file_name=' + encodeURIComponent(name) +
                     '&content_type=' + encodeURIComponent(type));
  // 2) 直传 MinIO（预签名按目标 host 签名，改走本地代理避免跨域）
  var putUrl = up.upload_url.replace(/^https?:\/\/[^/]+/, '/minio');
  var res = await fetch(putUrl, { method: 'PUT', body: file }); // 不要手写 Content-Type
  if(!res.ok) throw new Error('图片上传到 MinIO 失败 HTTP ' + res.status);
  // 3) 返回可直接访问的读地址（object_name 形如 articles/images/xxx.png）
  return MINIO_BASE + '/' + up.object_name;
}

function insertImageFile(file){
  return uploadImageFile(file).then(function(url){
    var range = quill.getSelection(true) || { index: quill.getLength() };
    quill.insertEmbed(range.index, 'image', url, 'user');
    quill.setSelection(range.index + 1);
  }).catch(function(e){ msg('图片上传失败：' + e.message); });
}

function bindImageUpload(q){
  // 1) 粘贴图片：拦截默认的 base64 内嵌行为
  q.root.addEventListener('paste', function(e){
    var items = (e.clipboardData || {}).items || [];
    for(var i = 0; i < items.length; i++){
      if(items[i].type.indexOf('image') === 0){
        e.preventDefault();
        var f = items[i].getAsFile();
        if(f) insertImageFile(f);
      }
    }
  });
  // 2) 拖拽图片
  q.root.addEventListener('drop', function(e){
    var files = (e.dataTransfer || {}).files || [];
    for(var i = 0; i < files.length; i++){
      if(files[i].type.indexOf('image') === 0){
        e.preventDefault();
        insertImageFile(files[i]);
      }
    }
  });
  // 3) 工具栏图片按钮（覆盖 Quill 默认的 base64 行为）
  var tb = q.getModule('toolbar');
  if(tb) tb.addHandler('image', function(){
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = function(){ if(inp.files[0]) insertImageFile(inp.files[0]); };
    inp.click();
  });
}

function $(id){ return document.getElementById(id); }
function msg(t, ok){
  $('msgBox').innerHTML = t ? '<div class="msg '+(ok?'ok':'err')+'">'+t+'</div>' : '';
  if(t) setTimeout(function(){ $('msgBox').innerHTML=''; }, 3500);
}
function authHeader(){ return { 'Authorization': 'Bearer '+token, 'Content-Type': 'application/json' }; }

async function api(path, opts){
  opts = opts || {};
  opts.headers = Object.assign(opts.headers || {}, authHeader());
  var res = await fetch(ARTICLE_API + path, opts);
  var body = await res.json();
  if(body.code !== 200) throw new Error(body.msg || ('code='+body.code));
  return body.data;
}

async function doLogin(){
  try {
    var res = await fetch(USER_API + '/user/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username: $('loginUser').value, password: $('loginPass').value})
    });
    var body = await res.json();
    if(body.code !== 200) throw new Error(body.msg);
    token = body.data.token;
    localStorage.setItem('sa_token', token);
    enterMain();
  } catch(e){ msg('登录失败：'+e.message); }
}

async function doRegister(){
  try {
    var res = await fetch(USER_API + '/user/register', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username: $('loginUser').value, password: $('loginPass').value, email: $('loginUser').value + '@test.com'})
    });
    var body = await res.json();
    if(body.code !== 200) throw new Error(body.msg);
    msg('注册成功，请登录', true);
  } catch(e){ msg('注册失败：'+e.message); }
}

function logout(){
  token=''; localStorage.removeItem('sa_token');
  location.reload();
}

function enterMain(){
  $('loginView').classList.add('hidden');
  $('mainView').classList.remove('hidden');
  $('userBox').innerHTML = '<button onclick="logout()">退出登录</button>';
  loadList(1);
}

function showTab(t){
  ['list','new','detail'].forEach(function(k){
    $(k+'Pane').classList.add('hidden');
    var tb = $('tab'+k[0].toUpperCase()+k.slice(1));
    if(tb) tb.classList.toggle('active', k===t);
  });
  $(t+'Pane').classList.remove('hidden');
  if(t==='new') ensureEditor();
  if(t==='list') loadList(page);
}

async function loadList(p){
  try {
    var data = await api('/articles?page='+p+'&page_size=10');
    page = data.page || 1;
    $('pageNum').textContent = page;
    $('totalNum').textContent = data.total || 0;
    var box = $('listBox');
    var items = (data.articles || []).filter(function(a){ return a.status === 2; }); // 仅已发布
    if(!items.length){ box.innerHTML = '<div class="meta">暂无已发布文章</div>'; return; }
    box.innerHTML = items.map(function(a){
      var time = a.create_time ? new Date(a.create_time*1000).toLocaleString() : '';
      return '<div class="art" onclick="openDetail(\''+a.id+'\')">'+
        '<h3>'+esc(a.title)+'</h3>'+
        '<div class="meta">'+esc(a.author_name||a.author_id||'')+' · '+time+
        (a.manual_type_tag ? ' · <span class="badge">'+esc(a.manual_type_tag)+'</span>' : '')+
        '</div>'+
        (a.brief ? '<p class="brief">'+esc(a.brief)+'</p>' : '')+
        '</div>';
    }).join('');
  } catch(e){ msg('加载列表失败：'+e.message); }
}

async function openDetail(id){
  try {
    var d = await api('/article/'+id+'?incr_view=false');
    var a = d.article;
    var time = a.create_time ? new Date(a.create_time*1000).toLocaleString() : '';
    $('detailPane').classList.remove('hidden');
    $('listPane').classList.add('hidden');
    $('newPane').classList.add('hidden');
    var html = '<h2 style="margin-top:0;">'+esc(a.title)+'</h2>'+
      '<div class="meta">'+esc(a.author_name||'')+' · '+time+' · 状态 '+a.status+'</div>'+
      (a.brief ? '<p>'+esc(a.brief)+'</p>' : '')+
      '<div style="margin:14px 0;"><button class="danger" onclick="doDelete(\''+a.id+'\')">删除文章</button></div>'+
      '<div id="contentArea" class="meta">正文加载中…</div>';
    $('detailBox').innerHTML = html;
    // content 可能是 MinIO objectName（articles/...），也可能直接是正文
    try {
      var c = a.content || '';
      if(!c){ throw new Error('empty'); }
      if(c.indexOf('articles/') === 0){
        var r = await fetch(MINIO_BASE + '/' + c);
        if(!r.ok){ throw new Error('http ' + r.status); }
        c = await r.text();
      }
      // 富文本内容以 HTML 标签开头，按 HTML 渲染；纯文本按代码块显示
      if(/^\s*</.test(c)){
        $('contentArea').innerHTML = '<div class="article-body">'+c+'</div>';
      } else {
        $('contentArea').innerHTML = '<pre>'+esc(c)+'</pre>';
      }
    } catch(e2){
      $('contentArea').innerHTML = '<div class="meta">正文不存在或尚未上传</div>';
    }
  } catch(e){ msg('加载详情失败：'+e.message); }
}

async function doDelete(id){
  if(!confirm('确认删除这篇文章？')) return;
  try {
    await api('/article/'+id, {method:'DELETE'});
    msg('已删除', true);
    showTab('list');
  } catch(e){ msg('删除失败：'+e.message); }
}

async function doPublish(){
  var title = $('fTitle').value.trim();
  ensureEditor();
  var content = quill ? quill.root.innerHTML : '';
  var plain = quill ? quill.getText().trim() : '';
  if(!title || !plain){ msg('标题和正文必填'); return; }
  try {
    msg('第 1 步：申请上传地址…');
    // 1. 申请预签名 PUT 地址（富文本为 HTML）
    var up = await api('/article/upload/url?file_name=article.html&content_type=text/html');
    // 预签名 URL 指向 MinIO 地址，改走本地代理，避免浏览器跨域
    var putUrl = up.upload_url.replace(/^https?:\/\/[^/]+/, '/minio');
    var putRes = await fetch(putUrl, {method:'PUT', body: content});
    if(!putRes.ok) throw new Error('正文上传到 MinIO 失败 HTTP ' + putRes.status);
    // 3. 创建文章，content_path 用 objectName
    var tags = $('fTags').value.split(',').map(function(s){return s.trim();}).filter(Boolean);
    await api('/article', {method:'POST', body: JSON.stringify({
      title: title,
      brief: $('fBrief').value.trim(),
      content_path: up.object_name,
      cover_image_url: '',
      manual_type_tag: $('fTag').value.trim(),
      secondary_tags: tags
    })});
    msg('发布成功！', true);
    $('fTitle').value=''; $('fBrief').value='';
    if(quill) quill.setText('');
    showTab('list');
  } catch(e){ msg('发布失败：'+e.message); }
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
}); }

if(token) enterMain();
</script>
</body>
</html>
